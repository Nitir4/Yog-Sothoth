name: CLI and desktop packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI on ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Source CLI tests (Linux and macOS)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -q
      - name: Native process and PowerShell tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_portable_cli.py -v
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify installed CLI
        shell: bash
        run: python scripts/verify_install.py dist/*.whl

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build isolated Linux package
        run: sh scripts/build_appimage.sh
      - name: Smoke test bundled GUI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth dbus-x11
          python3 scripts/verify_appimage.py artifacts/*.AppImage
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Yog-Sothoth-Linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  desktop:
    name: Desktop on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        run: python -m pip install '.[desktop]' 'pyinstaller>=6.22.1,<7'
      - name: Check terminal plans and account dropdowns
        run: |
          python -m unittest discover -s tests -p test_desktop.py -v
          python -m unittest discover -s tests -p test_qt_gui.py -v
      - name: Build and exercise standalone GUI and CLI
        run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Yog-Sothoth-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
