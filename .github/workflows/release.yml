name: Release desktop and CLI packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Yog-Sothoth-*
          merge-multiple: true
          path: artifacts
      - name: Review distributable files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools
          python3 scripts/verify_release.py artifacts "$RELEASE_TAG"
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Desktop and CLI packages for Linux, Windows, and macOS.

          - Linux: x86_64 AppImage, with bundled Python and GTK.
          - Windows: portable ZIP with a GUI executable and standalone console CLI.
          - macOS: application bundles for Apple Silicon and Intel, with a console helper.
          - Portable Python wheel for CLI use on all three platforms.
          - Inspected Antigravity 1.3.1 account isolation on Linux, Windows, and macOS.

          Extract Windows/macOS packages completely. Install the native coding CLIs separately and sign in with your own accounts. Account selections apply to new launches; running sessions retain their account.

          Windows/macOS packages lack publisher signing/notarization. See the README for setup, checksums, and platform details. Live provider sign-in remains a manual check; CI uses synthetic credentials and isolated native profile probes.

          Packages are built from the reviewed source, tested on native runners, and checked for private workspace files before publication.
          NOTES
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --prerelease --title "Yog-Sothoth $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
